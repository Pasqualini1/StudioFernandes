<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Fernandes | Agenda</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="icon" href="icons/logo1.png" type="image/x-icon" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="agenda.css?v=2" />
</head>

<body>

  <!-- Cabeçalho -->
  <header class="header d-flex justify-content-between align-items-center px-3 py-2">
    <div class="d-flex align-items-center gap-3">
      <img src="icons/logo2.png" alt="Logo Studio Fernandes" class="logo2" />
      <h1 class="header h1">Studio Fernandes</h1>
    </div>

    <button id="logoutDesktop" class="logout" aria-label="Sair" onclick="logout()">
      <i class="fa-solid fa-right-from-bracket me-1"></i>
      <span class="logout-text">Sair</span>
    </button>

    <button class="menu-toggle d-md-none" aria-label="Abrir Menu" onclick="toggleMenu()">
      <i class="fa-solid fa-bars fs-2"></i>
    </button>

    <div id="mobileMenu" class="mobile-menu d-none">
      <button class="btn btn-danger w-100 my-2" onclick="logout()">Sair</button>
    </div>
  </header>

  <!-- Corpo principal -->
  <div class="container mt-4">
    <div class="calendar-header d-flex mb-3">
      <button id="prev" class="nav-btn">&#x276E;</button>
      <span id="mesAno" class="fw-bold"></span>
      <button id="next" class="nav-btn">&#x276F;</button>
    </div>

    <div class="semana d-flex justify-content-between text-center fw-bold mb-2">
      <div class="flex-fill">DOM</div>
      <div class="flex-fill">SEG</div>
      <div class="flex-fill">TER</div>
      <div class="flex-fill">QUA</div>
      <div class="flex-fill">QUI</div>
      <div class="flex-fill">SEX</div>
      <div class="flex-fill">SÁB</div>
    </div>

    <div id="calendar" class="calendar-grid"></div>
  </div>

  <!-- Botão flutuante -->
  <button id="btnFlutuante" class="btn btn-primary rounded-circle position-fixed">
    <i class="fa-solid fa-plus"></i>
  </button>

  <!-- Modal de agendamento -->
  <div id="modalAgendamento" class="modal" tabindex="-1">
    <div class="modal-content p-4 rounded">
      <span id="fecharModal" class="close">&times;</span>
      <h2 class="mb-3">Novo Agendamento</h2>
      <form id="formAgendamento" class="d-grid gap-2">

        <label for="nome">Nome:</label>
        <input type="text" class="form-control" id="nome" name="nome" placeholder="Nome" required />

        <label>Serviços:</label>
        <div class="d-flex gap-4 fs-3">
          <label>
            <input type="checkbox" name="servicos" value="pé" />
            <i>Pé</i>
          </label>
          <label>
            <input type="checkbox" name="servicos" value="mão" />
            <i>Mão</i>
          </label>
          <label>
            <input type="checkbox" name="servicos" value="sobrancelha" />
            <i>Sobrancelha</i>
          </label>
        </div>

        <label for="rua">Rua:</label>
        <input type="text" class="form-control" id="rua" name="rua" placeholder="Rua" />

        <label for="numero">Número:</label>
        <input type="text" class="form-control" id="numero" name="numero" placeholder="Nmr da Casa" />

        <label for="data">Data:</label>
        <input type="date" class="form-control" id="data" name="data" required />

        <label for="hora">Hora:</label>
        <input type="time" class="form-control" id="hora" name="hora" required />

        <label for="whats">WhatsApp:</label>
        <input type="tel" class="form-control" id="whats" name="whats" placeholder="(00) 00000-0000" />

        <button class="btn btn-success enviar" type="submit">Salvar</button>
      </form>
    </div>
  </div>

  <!-- Modal para visualizar agendamentos -->
  <div id="modalVisualizar" class="modalAgendamentos">
    <div class="modal-contentAgendamentos p-4">
      <span id="fecharModalVisualizar" class="close">&times;</span>
      <h2>Agendamentos do dia <span id="dataSelecionada"></span></h2>
      <div id="listaAgendamentos"></div>
    </div>
  </div>

  <!-- Modal de edição de agendamento -->
  <div id="modalEditar" class="modalEditarAgendamentos">
    <div class="modal-contentEditarAgendamentos p-4">
      <span id="fecharModalEditar" class="close">&times;</span>
      <h2>Editar Agendamento</h2>
      <form id="formEditar" class="d-grid gap-2">
        <input type="text" class="form-control" id="editarNome" placeholder="Nome" />
        <input type="text" class="form-control" id="editarServico" placeholder="Serviço" />
        <input type="text" class="form-control" id="editarRua" placeholder="Rua" />
        <input type="text" class="form-control" id="editarNumero" placeholder="Número" />
        <input type="date" class="form-control" id="editarData" />
        <input type="time" class="form-control" id="editarHora" />
        <input type="text" class="form-control" id="editarWhats" placeholder="WhatsApp" />
        <button type="submit" class="btn btn-primary btSalvarEditarAgendamento">Salvar</button>
      </form>
    </div>
  </div>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script personalizado -->
  <script src="agenda.js?v=2"></script>

</body>

</html>
