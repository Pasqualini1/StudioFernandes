<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Studio Fernandes</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#a88bbf">
  <link rel="apple-touch-icon" href="icons/logo1.png">

  <link rel="icon" href="icons/logo1.png" type="image/x-icon" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <link rel="stylesheet" href="login.css" />

</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <img src="icons/logo2.png" alt="Logo Studio Fernandes" class="login-logo mx-auto d-block mb-3" />
        <div class="card shadow-sm p-4">
          <h1 class="text-center mb-4">Studio Fernandes</h1>
          <form id="login-form">
            <div class="mb-3">
              <input type="text" id="username" class="form-control" placeholder="Usuário" required>
            </div>
            <div class="mb-3">
              <input type="password" id="password" class="form-control" placeholder="Senha" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
            <p id="error-msg" class="text-danger mt-3 text-center"></p>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>

</html>
